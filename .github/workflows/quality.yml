name: 품질 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 확인
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 코드 검사
        run: npm run lint

      - name: 테스트
        run: npm run test

      - name: 프로덕션 빌드
        run: npm run build
